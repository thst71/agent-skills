name: check

on:
  push:
  pull_request:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Relative Markdown links resolve
        run: |
          rc=0
          while IFS= read -r file; do
            dir=$(dirname "$file")
            for target in $(grep -oE '\]\([^)#:]+\)' "$file" | sed -E 's/^\]\(//; s/\)$//'); do
              if [ ! -e "$dir/$target" ]; then
                echo "$file: broken link $target"
                rc=1
              fi
            done
          done < <(find . -name '*.md' -not -path './.git/*')
          exit $rc
      - name: Shell scripts pass shellcheck
        run: |
          files=$(grep -rlE '^#!(/bin/|/usr/bin/env )(ba)?sh' --exclude-dir=.git . || true)
          if [ -n "$files" ]; then shellcheck $files; fi
      - name: Validator launcher
        run: bash tests/launcher_test.sh

  snippets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Workflow snippets of the profiles pass actionlint
        run: bash tests/profile_snippets_test.sh

  # Every project-template variant with this commit of the library in place of its vendored one:
  # init, gate, blackbox or BDT tests, reports and rendering. Pull requests and main only.
  template:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    uses: thst71/project-template/.github/workflows/template.yml@main
    with:
      agent-skills-ref: ${{ github.event.pull_request.head.sha || github.sha }}
