# Every project-template variant with this commit of the library in place of its vendored one:
# init, gate, blackbox or BDT tests, reports and rendering. A workflow of its own, so that a fault in
# the called workflow cannot stop the checks of check.yml. Started by hand (Actions, "Run workflow"),
# it runs the chosen branch or tag, e.g. to check a tag whose run on main failed.
name: template

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  variants:
    uses: thst71/project-template/.github/workflows/template.yml@main
    with:
      agent-skills-ref: ${{ github.event.pull_request.head.sha || github.sha }}
